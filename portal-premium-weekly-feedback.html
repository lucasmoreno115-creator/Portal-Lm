<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Check-in semanal | Portal LM</title>
  <link rel="stylesheet" href="public/assets/css/portal-premium-weekly-feedback.css">
  <script src="public/assets/js/lm-access.js?v=20260623-1"></script>
  <script src="portal-shared.js"></script>
  <script>requireAuth(); redirectIfNoAccess('checkin');</script>
</head>
<body>
  <main class="wf">
    <header class="weekly-feedback-hero">
      <p class="eyebrow">Consultoria Premium</p>
      <h1>Check-in semanal</h1>
      <p>Um espaço para registrar sua semana e acompanhar as respostas do seu acompanhamento.</p>
    </header>

    <section id="currentSection" class="card weekly-feedback-state" aria-labelledby="currentHeading" aria-busy="true">
      <div id="currentStatus" class="state-message" role="status" aria-live="polite">
        <h2 id="currentHeading">Carregando seu check-in...</h2>
      </div>
      <div id="currentContent"></div>
      <button id="retryCurrent" class="secondary-button" type="button" hidden>Tentar novamente</button>
    </section>

    <section class="card weekly-feedback-history" aria-labelledby="historyHeading">
      <h2 id="historyHeading">Histórico de check-ins</h2>
      <div id="history" aria-busy="true"><p>Carregando histórico...</p></div>
      <button id="retryHistory" class="secondary-button" type="button" hidden>Tentar novamente</button>
    </section>
  </main>
  <script src="public/assets/js/portal-premium-weekly-feedback.js" defer></script>
  <script src="public/assets/js/pwa-register.js" defer></script>
</body>
</html>
