<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Check-in semanal | Portal LM</title>
  <link rel="stylesheet" href="portal.css">
  <link rel="stylesheet" href="assets/css/portal-premium-weekly-feedback.css">
  <script src="/assets/js/lm-access.js?v=20260623-1"></script>
  <script src="portal-shared.js"></script>
  <script>requireAuth(); redirectIfNoAccess('checkin');</script>
</head>
<body>
  <main class="wf">
    <a class="secondary-link weekly-feedback-home" href="portal-premium-home.html">← Voltar para Home</a>
    <header class="weekly-feedback-hero">
      <p class="eyebrow">Consultoria Premium</p>
      <h1>Check-in semanal</h1>
      <p>Um espaço para registrar sua semana e acompanhar as respostas do seu acompanhamento.</p>
    </header>

    <section id="currentSection" class="card weekly-feedback-state" aria-labelledby="currentHeading" aria-busy="true">
      <div id="currentStatus" class="state-message" role="status" aria-live="polite">
        <h2 id="currentHeading">Carregando seu check-in...</h2>
      </div>
      <div id="currentContent"></div>
      <button id="retryCurrent" class="secondary-button" type="button" hidden>Tentar novamente</button>
    </section>

    <section class="card weekly-feedback-history" aria-labelledby="historyHeading">
      <h2 id="historyHeading">Histórico de check-ins</h2>
      <div id="history" aria-busy="true"><p>Carregando histórico...</p></div>
      <button id="retryHistory" class="secondary-button" type="button" hidden>Tentar novamente</button>
    </section>
  </main>
  <script id="weeklyFeedbackConfig">(()=>{const PORTAL_LOCALE='pt-BR';const PORTAL_TIME_ZONE='America/Sao_Paulo';const ANSWER_FIELDS=Object.freeze([['training_adherence','Treinos','trainingAdherence','textarea'],['nutrition_adherence','Alimentação','nutritionAdherence','textarea'],['cardio_adherence','Cardio','cardioAdherence','input'],['free_meals','Refeições livres','freeMeals','input'],['hunger_level','Fome','hungerLevel','input'],['binge_or_snacking','Beliscos/compulsão','bingeOrSnacking','input'],['sleep_quality','Sono','sleepQuality','input'],['energy_level','Energia','energyLevel','input'],['stress_level','Estresse','stressLevel','input'],['weekly_weight','Peso','weeklyWeight','input'],['strength_status','Força','strengthStatus','input'],['main_difficulty','Principal dificuldade','mainDifficulty','textarea'],['routine_context','Rotina','routineContext','textarea'],['weekly_score','Nota da semana','weeklyScore','input'],['support_needed','Onde você precisa de ajuda','supportNeeded','textarea'],]);function formatPortalDate(value,options={}){if(!value)return'';const date=new Date(value);if(Number.isNaN(date.getTime()))return'';return new Intl.DateTimeFormat(PORTAL_LOCALE,{timeZone:PORTAL_TIME_ZONE,dateStyle:'long',timeStyle:'short',...options,}).format(date);}function isoWeekRange(weekRef){const match=/^(\d{4})-W(\d{2})$/.exec(String(weekRef||''));if(!match)return null;const year=Number(match[1]);const week=Number(match[2]);if(week<1||week>53)return null;const januaryFourth=new Date(Date.UTC(year,0,4));const monday=new Date(januaryFourth);monday.setUTCDate(januaryFourth.getUTCDate()-((januaryFourth.getUTCDay()+6)%7)+((week-1)*7));const sunday=new Date(monday);sunday.setUTCDate(monday.getUTCDate()+6);return{monday,sunday};}function formatWeekRef(weekRef){const range=isoWeekRange(weekRef);if(!range)return'Semana atual';const day=(date)=>new Intl.DateTimeFormat(PORTAL_LOCALE,{timeZone:'UTC',day:'numeric'}).format(date);const month=(date)=>new Intl.DateTimeFormat(PORTAL_LOCALE,{timeZone:'UTC',month:'long'}).format(date);const year=(date)=>new Intl.DateTimeFormat(PORTAL_LOCALE,{timeZone:'UTC',year:'numeric'}).format(date);const sameMonth=range.monday.getUTCMonth()===range.sunday.getUTCMonth();const sameYear=range.monday.getUTCFullYear()===range.sunday.getUTCFullYear();if(sameMonth)return`Semana de ${day(range.monday)} a ${day(range.sunday)} de ${month(range.sunday)}`;if(sameYear)return`Semana de ${day(range.monday)} de ${month(range.monday)} a ${day(range.sunday)} de ${month(range.sunday)}`;return`Semana de ${day(range.monday)} de ${month(range.monday)} de ${year(range.monday)} a ${day(range.sunday)} de ${month(range.sunday)} de ${year(range.sunday)}`;}window.WeeklyFeedbackConfig=Object.freeze({ANSWER_FIELDS,PORTAL_LOCALE,PORTAL_TIME_ZONE,formatPortalDate,formatWeekRef,isoWeekRange});})();</script>
  <script src="assets/js/portal-premium-weekly-feedback.js" defer></script>
  <script src="/assets/js/pwa-register.js" defer></script>
</body>
</html>
