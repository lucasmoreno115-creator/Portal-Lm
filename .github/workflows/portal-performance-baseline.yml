name: Portal performance baseline
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/portal-performance-baseline.yml'
      - 'package.json'
      - 'config/portal-performance-profile.json'
      - 'scripts/analyze-portal-performance.mjs'
      - 'scripts/compare-portal-performance.mjs'
      - 'scripts/measure-portal-performance.mjs'
      - 'scripts/lib/portal-performance-*.mjs'
      - 'tests/portal-performance-measurement.test.mjs'
      - 'tests/portal-performance-smoke.mjs'
      - 'tests/portal-performance-analysis.test.mjs'
      - 'tests/portal-home-layout-stability.test.mjs'
      - 'public/**'
jobs:
  measure:
    runs-on: ubuntu-latest
    env:
      MEASUREMENT_COMMAND: npm run performance:portal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - id: resolve-chrome
        shell: bash
        run: |
          set -euo pipefail
          candidates=()
          for command_name in google-chrome google-chrome-stable chromium chromium-browser; do
            if command_path="$(command -v "$command_name" 2>/dev/null)"; then
              candidates+=("$command_path")
            fi
          done
          if [ -n "${{ steps.setup-chrome.outputs.chrome-path }}" ]; then
            candidates+=("${{ steps.setup-chrome.outputs.chrome-path }}")
          fi
          printf '%s\n' 'Chrome candidates:'
          for candidate in "${candidates[@]}"; do
            printf '  %s\n' "$candidate"
          done
          selected=""
          for candidate in "${candidates[@]}"; do
            if [ -f "$candidate" ] && [ -x "$candidate" ]; then
              "$candidate" --version
              selected="$candidate"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo 'No executable Chrome candidate found.' >&2
            exit 1
          fi
          printf 'Selected Chrome: %s\n' "$selected"
          printf 'chrome_bin=%s\n' "$selected" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: S0.6 unit tests
        run: node --test tests/portal-home-layout-stability.test.mjs
      - run: npm run performance:portal:test
      - name: Existing suite
        run: npm test
      - run: npm run performance:portal:smoke
        env:
          CHROME_BIN: ${{ steps.resolve-chrome.outputs.chrome_bin }}
      - name: Resolve immutable provenance
        id: provenance
        env:
          BASELINE_SHA: 9fcbc86fa63ca9c0792b789d774de8cf13d2b366
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASELINE_SHA}^{commit}"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BASELINE_SHA" != "$HEAD_SHA"
          printf 'baseline_sha=%s\nhead_sha=%s\ncheckout_sha=%s\n' "$BASELINE_SHA" "$HEAD_SHA" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Measure immutable S0.6 before
        id: measure-before
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.resolve-chrome.outputs.chrome_bin }}
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/s06-before"
          cleanup() { git worktree remove --force "$before" 2>/dev/null || true; git worktree prune; }
          trap cleanup EXIT
          git cat-file -e "${{ steps.provenance.outputs.baseline_sha }}^{commit}"
          git worktree add --detach "$before" "${{ steps.provenance.outputs.baseline_sha }}"
          test "$(git -C "$before" rev-parse HEAD)" = "${{ steps.provenance.outputs.baseline_sha }}"
          # Compare immutable assets with one measurement implementation. The
          # historical S0.5 collector is not the S0.6 harness and has obsolete
          # Chrome/CDP lifecycle and fixture behavior.
          rm -rf "$before/scripts"
          cp -a "$GITHUB_WORKSPACE/scripts" "$before/scripts"
          cp "$GITHUB_WORKSPACE/config/portal-performance-profile.json" "$before/config/portal-performance-profile.json"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$before/node_modules"
          mkdir -p artifacts/performance/s0.6/before
          (cd "$before" && env \
            -u GITHUB_SHA \
            -u PERFORMANCE_BASE_SHA \
            PERFORMANCE_CHECKOUT_SHA="${{ steps.provenance.outputs.baseline_sha }}" \
            PERFORMANCE_HEAD_SHA="${{ steps.provenance.outputs.baseline_sha }}" \
            PERFORMANCE_EVENT_NAME=local \
            PERFORMANCE_REF=local \
            CHROME_BIN="$CHROME_BIN" \
            npm run performance:portal) 2>&1 | tee artifacts/performance/s0.6/before/measurement.log
          cp "$before"/artifacts/performance/portal-performance-report.{json,md} artifacts/performance/s0.6/before/
          node -e "const r=JSON.parse(require('fs').readFileSync('artifacts/performance/s0.6/before/portal-performance-report.json'));const s=r.source,b='${{ steps.provenance.outputs.baseline_sha }}';if(s.eventName!=='local'||s.ref!=='local'||s.checkoutSha!==b||s.headSha!==b||s.baseSha!==null||s.workflowSha!==null||s.canonicalMainSha!==null)process.exit(1)"
      - name: Verify worktree cleanup
        if: always()
        run: |
          git worktree prune
          if git worktree list --porcelain | grep -F "$RUNNER_TEMP/s06-before"; then exit 1; fi
      - name: Measure S0.6 after
        id: measure-after
        if: always()
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.resolve-chrome.outputs.chrome_bin }}
          PERFORMANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PERFORMANCE_HEAD_SHA: ${{ steps.provenance.outputs.head_sha }}
          PERFORMANCE_CHECKOUT_SHA: ${{ steps.provenance.outputs.checkout_sha }}
          PERFORMANCE_EVENT_NAME: ${{ github.event_name }}
          PERFORMANCE_REF: ${{ github.ref }}
        run: |
          mkdir -p artifacts/performance/s0.6/after
          npm run performance:portal 2>&1 | tee artifacts/performance/s0.6/after/measurement.log
          cp artifacts/performance/portal-performance-report.{json,md} artifacts/performance/s0.6/after/
      - name: Analyze measured after
        id: analyze-after
        if: always() && steps.measure-after.outcome == 'success'
        continue-on-error: true
        run: npm run performance:portal:analyze
      - name: Compare S0.6
        id: compare
        if: always()
        continue-on-error: true
        env:
          PERFORMANCE_BASELINE_SHA: ${{ steps.provenance.outputs.baseline_sha }}
          PERFORMANCE_HEAD_SHA: ${{ steps.provenance.outputs.head_sha }}
          PERFORMANCE_CHECKOUT_SHA: ${{ steps.provenance.outputs.checkout_sha }}
          PERFORMANCE_WORKFLOW_SHA: ${{ github.sha }}
          PERFORMANCE_EVENT_NAME: ${{ github.event_name }}
          PERFORMANCE_REF: ${{ github.ref }}
        run: |
          npm run performance:portal:compare
      - name: Validate S0.6 outcome
        if: always()
        run: |
          test "${{ steps.measure-before.outcome }}" = success || { echo 'BEFORE_MEASUREMENT_FAILED'; exit 1; }
          test "${{ steps.measure-after.outcome }}" = success || { echo 'AFTER_MEASUREMENT_FAILED'; exit 1; }
          test "${{ steps.analyze-after.outcome }}" = success || { echo 'AFTER_ANALYSIS_FAILED'; exit 1; }
          test "${{ steps.compare.outcome }}" = success || { echo 'COMPARISON_FAILED'; exit 1; }
          node -e "const c=JSON.parse(require('fs').readFileSync('artifacts/performance/s0.6/comparison.json'));if(c.status!=='PASSED'||c.baselineSha!=='${{ steps.provenance.outputs.baseline_sha }}'||c.headSha!=='${{ steps.provenance.outputs.head_sha }}'||c.before.sha!=='${{ steps.provenance.outputs.baseline_sha }}')process.exit(1)"
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-performance-baseline
          path: |
            artifacts/performance/portal-performance-report.json
            artifacts/performance/portal-performance-report.md
            artifacts/performance/portal-performance-analysis.json
            artifacts/performance/portal-performance-analysis.md
            artifacts/performance/s0.6/
          if-no-files-found: warn
