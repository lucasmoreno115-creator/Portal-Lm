name: Portal performance baseline
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/portal-performance-profile.json'
      - 'scripts/measure-portal-performance.mjs'
      - 'scripts/lib/portal-performance-*.mjs'
      - 'tests/portal-performance-measurement.test.mjs'
      - 'tests/portal-performance-smoke.mjs'
      - 'tests/portal-performance-analysis.test.mjs'
      - 'public/**'
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - id: resolve-chrome
        shell: bash
        run: |
          set -euo pipefail
          candidates=()
          for command_name in google-chrome google-chrome-stable chromium chromium-browser; do
            if command_path="$(command -v "$command_name" 2>/dev/null)"; then
              candidates+=("$command_path")
            fi
          done
          if [ -n "${{ steps.setup-chrome.outputs.chrome-path }}" ]; then
            candidates+=("${{ steps.setup-chrome.outputs.chrome-path }}")
          fi
          printf '%s\n' 'Chrome candidates:'
          for candidate in "${candidates[@]}"; do
            printf '  %s\n' "$candidate"
          done
          selected=""
          for candidate in "${candidates[@]}"; do
            if [ -f "$candidate" ] && [ -x "$candidate" ]; then
              "$candidate" --version
              selected="$candidate"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo 'No executable Chrome candidate found.' >&2
            exit 1
          fi
          printf 'Selected Chrome: %s\n' "$selected"
          printf 'chrome_bin=%s\n' "$selected" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run performance:portal:test
      - run: npm run performance:portal:smoke
        env:
          CHROME_BIN: ${{ steps.resolve-chrome.outputs.chrome_bin }}
      - run: npm run performance:portal
        env:
          CHROME_BIN: ${{ steps.resolve-chrome.outputs.chrome_bin }}
      - name: Analyze parseable report
        run: |
          node -e "JSON.parse(require('fs').readFileSync('artifacts/performance/portal-performance-report.json'))"
          npm run performance:portal:analyze
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-performance-baseline
          path: |
            artifacts/performance/portal-performance-report.json
            artifacts/performance/portal-performance-report.md
            artifacts/performance/portal-performance-analysis.json
            artifacts/performance/portal-performance-analysis.md
          if-no-files-found: warn
