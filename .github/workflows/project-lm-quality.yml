name: Project LM Quality Gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: project-lm-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Runtime sync and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate baseline and enforce regression budget
        run: npm run baseline:check

      - name: Upload technical baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-baseline
          path: artifacts/baseline/
          if-no-files-found: warn

      - name: Ensure clean working tree
        run: git diff --exit-code
