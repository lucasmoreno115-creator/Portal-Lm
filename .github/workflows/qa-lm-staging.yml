name: QA LM Staging E2E

on:
  workflow_dispatch:
    inputs:
      qa_base_url:
        description: 'URL opcional para execução manual. Quando vazia, o workflow usa o preview Cloudflare determinístico do SHA do checkout.'
        required: false
        type: string
  schedule:
    - cron: '0 11 * * 6'

permissions:
  contents: read

jobs:
  staging-e2e:
    name: Staging autenticado ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      MANUAL_QA_BASE_URL: ${{ inputs.qa_base_url }}
      SECRET_QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME || 'lm-system-api' }}
      CF_WORKERS_SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN || 'lucasmoreno115' }}
      QA_STUDENT_EMAIL: ${{ secrets.QA_STUDENT_EMAIL }}
      QA_STUDENT_TOKEN: ${{ secrets.QA_STUDENT_TOKEN }}
      QA_TARGET_ENVIRONMENT: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve QA base URL
        id: resolve-url
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${MANUAL_QA_BASE_URL:-}"
          SOURCE="workflow input"
          EXPECTED_SHA="${GITHUB_SHA}"

          if [[ -z "$BASE_URL" ]]; then
            BASE_URL="${SECRET_QA_BASE_URL:-}"
            SOURCE="QA_BASE_URL secret"
          fi

          if [[ -z "$BASE_URL" ]]; then
            if [[ -z "${CF_WORKERS_SUBDOMAIN:-}" ]]; then
              echo "CF_WORKERS_SUBDOMAIN não está configurado." >&2
              exit 1
            fi
            BASE_URL="https://sha-${EXPECTED_SHA}-${CF_WORKER_NAME}.${CF_WORKERS_SUBDOMAIN}.workers.dev"
            SOURCE="Cloudflare SHA preview alias"
          fi

          BASE_URL="${BASE_URL%/}"
          echo "QA_BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "QA_EXPECTED_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "URL resolvida por: $SOURCE"
          echo "SHA esperado: $EXPECTED_SHA"
          echo "URL de teste: $BASE_URL"

      - name: Wait for preview availability
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if scripts/check-qa-preview-health.sh "${QA_BASE_URL}/portal-login.html"; then
              exit 0
            fi
            echo "Tentativa $attempt/40: preview do SHA ${QA_EXPECTED_SHA} ainda indisponível."
            sleep 6
          done
          echo "Preview do SHA não ficou disponível no tempo esperado: ${QA_BASE_URL}" >&2
          exit 1

      - name: Verify preview fidelity
        shell: bash
        run: |
          set -euo pipefail
          expected_host="sha-${QA_EXPECTED_SHA}-${CF_WORKER_NAME}.${CF_WORKERS_SUBDOMAIN}.workers.dev"
          actual_host="$(node -e 'process.stdout.write(new URL(process.argv[1]).hostname)' "$QA_BASE_URL")"
          if [[ "${{ steps.resolve-url.outputs.source }}" == "Cloudflare SHA preview alias" && "$actual_host" != "$expected_host" ]]; then
            echo "Preview divergente: expected=${expected_host} actual=${actual_host}" >&2
            exit 1
          fi
          echo "Preview fidelity: source=${{ steps.resolve-url.outputs.source }} sha=${QA_EXPECTED_SHA} host=${actual_host}"

      - name: Authenticate QA administrator
        env:
          QA_ADMIN_TOKEN: ${{ secrets.QA_ADMIN_TOKEN }}
        run: node scripts/authenticate-qa-admin.mjs

      - name: Execute authenticated staging QA
        shell: bash
        run: |
          set -o pipefail
          npm run qa:lm:sprint7 | tee qa-sprint7-report.json

      - name: Execute Premium entry operational smoke
        shell: bash
        run: |
          set -o pipefail
          npm run qa:lm:premium-entry | tee qa-premium-entry-report.json

      - name: Execute Premium anamnesis operational smoke
        shell: bash
        run: |
          set -o pipefail
          npm run qa:lm:premium-anamnesis | tee qa-premium-anamnesis-report.json

      - name: Execute Premium professional objectives operational smoke
        shell: bash
        run: |
          set -o pipefail
          npm run qa:lm:premium-objectives | tee qa-premium-objectives-report.json

      - name: Execute Premium nutrition planning operational smoke
        shell: bash
        run: |
          set -o pipefail
          npm run qa:lm:premium-nutrition-plan | tee qa-premium-nutrition-plan-report.json

      - name: Execute Premium nutrition versioning operational smoke
        shell: bash
        run: |
          set -o pipefail
          npm run qa:lm:premium-nutrition-versioning | tee qa-premium-nutrition-versioning-report.json

      - name: Execute Premium weekly check-in response operational smoke
        shell: bash
        run: |
          set -o pipefail
          npm run qa:lm:premium-weekly-checkin-response | tee qa-premium-weekly-checkin-response-report.json

      - name: Publish resolved target
        if: always()
        run: |
          {
            echo '### QA LM Staging E2E'
            echo ''
            echo "- URL: \`${QA_BASE_URL:-não resolvida}\`"
            echo "- Origem: \`${{ steps.resolve-url.outputs.source }}\`"
            echo "- SHA esperado: \`${QA_EXPECTED_SHA:-não resolvido}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-lm-staging-e2e
          path: |
            qa-sprint7-report.json
            qa-premium-entry-report.json
            qa-premium-anamnesis-report.json
            qa-premium-objectives-report.json
            qa-premium-nutrition-plan-report.json
            qa-premium-nutrition-versioning-report.json
            qa-premium-weekly-checkin-response-report.json
          retention-days: 30
