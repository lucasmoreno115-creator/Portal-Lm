name: QA LM Staging E2E

on:
  workflow_dispatch:
    inputs:
      qa_base_url:
        description: 'URL opcional para execução manual. Quando vazia, o workflow usa o version_id registrado pelo deploy bem-sucedido do mesmo SHA.'
        required: false
        type: string
  schedule:
    - cron: '0 11 * * 6'

permissions:
  contents: read
  actions: read

jobs:
  staging-e2e:
    name: Staging autenticado ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      MANUAL_QA_BASE_URL: ${{ inputs.qa_base_url }}
      SECRET_QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME || 'lm-system-api' }}
      CF_WORKERS_SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN || 'lucasmoreno115' }}
      QA_STUDENT_EMAIL: ${{ secrets.QA_STUDENT_EMAIL }}
      QA_STUDENT_TOKEN: ${{ secrets.QA_STUDENT_TOKEN }}
      QA_TARGET_ENVIRONMENT: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve QA base URL
        id: resolve-url
        shell: bash
        env:
          GH_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASE_URL="${MANUAL_QA_BASE_URL:-}"
          SOURCE="workflow input"
          EXPECTED_SHA="${GITHUB_SHA}"
          VERSION_ID=""
          DEPLOY_RUN_ID=""

          if [[ -z "$BASE_URL" ]]; then
            BASE_URL="${SECRET_QA_BASE_URL:-}"
            SOURCE="QA_BASE_URL secret"
          fi

          if [[ -z "$BASE_URL" ]]; then
            if [[ -z "${CF_WORKERS_SUBDOMAIN:-}" || -z "${GH_ACTIONS_TOKEN:-}" ]]; then
              echo "CF_WORKERS_SUBDOMAIN e GitHub Actions token são obrigatórios para resolver o deploy pelo SHA." >&2
              exit 1
            fi

            for attempt in $(seq 1 60); do
              RUNS=$(curl --fail-with-body --silent --show-error \
                --header "Authorization: Bearer ${GH_ACTIONS_TOKEN}" \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/cloudflare-deploy.yml/runs?head_sha=${EXPECTED_SHA}&event=push&per_page=10")

              set +e
              DEPLOY_RUN_ID=$(printf '%s' "$RUNS" | node -e '
                let input=""; process.stdin.on("data",c=>input+=c); process.stdin.on("end",()=>{
                  const sha=process.argv[1]; const payload=JSON.parse(input); const runs=(payload.workflow_runs||[]).filter(r=>r.head_sha===sha);
                  const success=runs.find(r=>r.status==="completed"&&r.conclusion==="success");
                  if(success){process.stdout.write(String(success.id)); return;}
                  if(runs.some(r=>r.status!=="completed")){process.exitCode=2; return;}
                  if(runs.length===0){process.exitCode=2; return;}
                  console.error(`Deploy workflow for ${sha} completed without success: ${runs.map(r=>r.conclusion).join(",")}`); process.exitCode=1;
                });
              ' "$EXPECTED_SHA")
              RUN_STATUS=$?
              set -e

              if [[ "$RUN_STATUS" -eq 0 && -n "$DEPLOY_RUN_ID" ]]; then
                break
              fi
              if [[ "$RUN_STATUS" -ne 2 ]]; then
                echo "Deploy Cloudflare do SHA ${EXPECTED_SHA} terminou sem sucesso." >&2
                exit 1
              fi
              echo "Tentativa $attempt/60: aguardando deploy bem-sucedido do SHA ${EXPECTED_SHA}."
              sleep 10
            done

            if [[ -z "$DEPLOY_RUN_ID" ]]; then
              echo "Nenhum deploy Cloudflare bem-sucedido foi encontrado para ${EXPECTED_SHA}." >&2
              exit 1
            fi

            ARTIFACTS=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_ACTIONS_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOY_RUN_ID}/artifacts?per_page=100")
            ARTIFACT_NAME="cloudflare-worker-version-${EXPECTED_SHA}"
            ARTIFACT_ID=$(printf '%s' "$ARTIFACTS" | node -e '
              let input=""; process.stdin.on("data",c=>input+=c); process.stdin.on("end",()=>{
                const name=process.argv[1]; const payload=JSON.parse(input); const matches=(payload.artifacts||[]).filter(a=>a.name===name&&!a.expired);
                if(matches.length!==1){console.error(`Expected exactly one non-expired artifact ${name}, got ${matches.length}`); process.exitCode=1; return;}
                process.stdout.write(String(matches[0].id));
              });
            ' "$ARTIFACT_NAME")

            mkdir -p "$RUNNER_TEMP/worker-deploy-metadata"
            curl --fail --location --silent --show-error \
              --header "Authorization: Bearer ${GH_ACTIONS_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output "$RUNNER_TEMP/worker-deploy-metadata.zip" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
            unzip -q -o "$RUNNER_TEMP/worker-deploy-metadata.zip" -d "$RUNNER_TEMP/worker-deploy-metadata"

            VERSION_ID=$(node -e '
              const fs=require("node:fs");
              const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const sha=process.argv[2], worker=process.argv[3];
              if(m.schemaVersion!==1||m.gitSha!==sha||m.workerName!==worker||typeof m.versionId!=="string"||!m.versionId.trim()){
                console.error("Worker deploy metadata does not match checkout SHA/worker."); process.exit(1);
              }
              process.stdout.write(m.versionId.trim());
            ' "$RUNNER_TEMP/worker-deploy-metadata/worker-deploy-metadata.json" "$EXPECTED_SHA" "$CF_WORKER_NAME")

            VERSION_PREFIX="${VERSION_ID:0:8}"
            BASE_URL="https://${VERSION_PREFIX}-${CF_WORKER_NAME}.${CF_WORKERS_SUBDOMAIN}.workers.dev"
            SOURCE="Cloudflare deploy artifact"
          fi

          BASE_URL="${BASE_URL%/}"
          echo "QA_BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "QA_EXPECTED_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
          echo "QA_WORKER_VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"
          echo "QA_DEPLOY_RUN_ID=$DEPLOY_RUN_ID" >> "$GITHUB_ENV"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "deploy_run_id=$DEPLOY_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "URL resolvida por: $SOURCE"
          echo "SHA esperado: $EXPECTED_SHA"
          echo "Deploy run: ${DEPLOY_RUN_ID:-external-target}"
          echo "Worker version: ${VERSION_ID:-external-target}"
          echo "URL de teste: $BASE_URL"

      - name: Wait for preview availability
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if scripts/check-qa-preview-health.sh "${QA_BASE_URL}/portal-login.html"; then
              exit 0
            fi
            echo "Tentativa $attempt/20: preview ainda indisponível para version ${QA_WORKER_VERSION_ID:-external}."
            sleep 6
          done
          echo "Preview não ficou disponível no tempo esperado: ${QA_BASE_URL}" >&2
          exit 1

      - name: Verify preview fidelity
        shell: bash
        run: |
          set -euo pipefail
          actual_host="$(node -e 'process.stdout.write(new URL(process.argv[1]).hostname)' "$QA_BASE_URL")"
          if [[ "${{ steps.resolve-url.outputs.source }}" == "Cloudflare deploy artifact" ]]; then
            if [[ -z "${QA_WORKER_VERSION_ID:-}" || -z "${QA_DEPLOY_RUN_ID:-}" ]]; then
              echo "Version ID/deploy run ausente para alvo resolvido pelo deploy artifact." >&2
              exit 1
            fi
            expected_prefix="${QA_WORKER_VERSION_ID:0:8}"
            expected_host="${expected_prefix}-${CF_WORKER_NAME}.${CF_WORKERS_SUBDOMAIN}.workers.dev"
            if [[ "$actual_host" != "$expected_host" ]]; then
              echo "Preview divergente: expected=${expected_host} actual=${actual_host}" >&2
              exit 1
            fi
          fi
          echo "Preview fidelity: source=${{ steps.resolve-url.outputs.source }} sha=${QA_EXPECTED_SHA} deploy_run=${QA_DEPLOY_RUN_ID:-external} version=${QA_WORKER_VERSION_ID:-external} host=${actual_host}"

      - name: Authenticate QA administrator
        env:
          QA_ADMIN_TOKEN: ${{ secrets.QA_ADMIN_TOKEN }}
        run: node scripts/authenticate-qa-admin.mjs

      - name: Execute authenticated staging QA
        shell: bash
        run: |
          set -o pipefail
          npm run qa:lm:sprint7 | tee qa-sprint7-report.json

      - name: Execute Premium entry operational smoke
        shell: bash
        run: |
          set -o pipefail
          npm run qa:lm:premium-entry | tee qa-premium-entry-report.json

      - name: Execute Premium anamnesis operational smoke
        shell: bash
        run: |
          set -o pipefail
          npm run qa:lm:premium-anamnesis | tee qa-premium-anamnesis-report.json

      - name: Execute Premium professional objectives operational smoke
        shell: bash
        run: |
          set -o pipefail
          npm run qa:lm:premium-objectives | tee qa-premium-objectives-report.json

      - name: Execute Premium nutrition planning operational smoke
        shell: bash
        run: |
          set -o pipefail
          npm run qa:lm:premium-nutrition-plan | tee qa-premium-nutrition-plan-report.json

      - name: Execute Premium nutrition versioning operational smoke
        shell: bash
        run: |
          set -o pipefail
          npm run qa:lm:premium-nutrition-versioning | tee qa-premium-nutrition-versioning-report.json

      - name: Execute Premium weekly check-in response operational smoke
        shell: bash
        run: |
          set -o pipefail
          npm run qa:lm:premium-weekly-checkin-response | tee qa-premium-weekly-checkin-response-report.json

      - name: Publish resolved target
        if: always()
        run: |
          {
            echo '### QA LM Staging E2E'
            echo ''
            echo "- URL: \`${QA_BASE_URL:-não resolvida}\`"
            echo "- Origem: \`${{ steps.resolve-url.outputs.source }}\`"
            echo "- SHA esperado: \`${QA_EXPECTED_SHA:-não resolvido}\`"
            echo "- Deploy run: \`${QA_DEPLOY_RUN_ID:-externo/não resolvido}\`"
            echo "- Worker version: \`${QA_WORKER_VERSION_ID:-externo/não resolvido}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-lm-staging-e2e
          path: |
            qa-sprint7-report.json
            qa-premium-entry-report.json
            qa-premium-anamnesis-report.json
            qa-premium-objectives-report.json
            qa-premium-nutrition-plan-report.json
            qa-premium-nutrition-versioning-report.json
            qa-premium-weekly-checkin-response-report.json
          retention-days: 30
